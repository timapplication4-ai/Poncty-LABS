  .toast{position:fixed;left:50%;bottom:88px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:13px 20px;border-radius:30px;font-size:13.5px;font-weight:600;z-index:80;opacity:0;transition:opacity .2s;pointer-events:none;max-width:92%;text-align:center;box-shadow:0 12px 34px rgba(0,0,0,.3)}

  .link{color:var(--brand-dark);font-weight:700;text-decoration:none;border-bottom:2px solid rgba(79,70,229,.3);font-size:14px}
  .splash{display:grid;place-items:center;min-height:100vh;color:var(--muted);font-weight:600}
  .hint{font-size:12.5px;color:var(--muted);margin-top:10px;line-height:1.55}
  .pill{display:inline-block;font-size:10.5px;font-weight:800;padding:3px 10px;border-radius:20px;margin-left:8px;letter-spacing:.03em}
  .pill.a{background:rgba(255,255,255,.2);color:#fff} .pill.ar{background:rgba(255,255,255,.2);color:#ffd7d7}
  .empty{padding:22px;text-align:center;color:var(--muted);font-size:14px}
  .big-status{text-align:center;padding:30px 18px;border-radius:18px;font-weight:800;font-size:21px}
  .big-status.ok{background:var(--present-bg);color:var(--present)} .big-status.no{background:#eef0f7;color:var(--muted)}
  .rtabs{position:fixed;left:0;right:0;bottom:0;z-index:40;max-width:600px;margin:0 auto;background:rgba(255,255,255,.98);border-top:1px solid var(--line);display:grid;grid-template-columns:1fr 1fr;padding-bottom:var(--safe-b);box-shadow:0 -6px 24px rgba(26,33,80,.08)}
  .rtabs button{padding:11px 6px 9px;font-weight:700;color:var(--muted);font-size:11.5px;display:flex;flex-direction:column;align-items:center;gap:4px;position:relative}
  .rtabs button svg{width:22px;height:22px;stroke:currentColor}
  .rtabs button.on{color:var(--brand-dark)}
  .rtabs button.on::before{content:'';position:absolute;top:0;left:26%;right:26%;height:3px;border-radius:0 0 3px 3px;background:var(--grad)}
  .overlay{position:fixed;inset:0;z-index:60;background:rgba(26,33,80,.5);display:flex;align-items:flex-end;justify-content:center}
  .sheet{background:#fff;width:100%;max-width:600px;border-radius:24px 24px 0 0;padding:24px 20px calc(26px + var(--safe-b));box-shadow:0 -14px 48px rgba(0,0,0,.28);animation:up .24s cubic-bezier(.2,.8,.2,1)}
  @keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
  .sheet h3{margin:0 0 8px;font-size:20px;font-weight:800;letter-spacing:-.2px}
  .msub{color:var(--muted);font-size:14px;margin:0 0 18px;line-height:1.5}
  .lc-error{background:var(--absent-bg);color:#a01212;border-radius:12px;padding:12px 14px;font-size:13px;font-weight:600;margin-bottom:14px}
</style>

function getPos(){return new Promise((res,rej)=>{ if(!window.isSecureContext){rej({code:99});return;} if(!navigator.geolocation){rej({code:98});return;} navigator.geolocation.getCurrentPosition(p=>res(p.coords),e=>rej(e),{enableHighAccuracy:true,timeout:15000,maximumAge:0}); });}

function fmtDateFR(iso){ if(!iso) return ''; const d=new Date(iso); const p=n=>String(n).padStart(2,'0'); return `${p(d.getDate())}/${p(d.getMonth()+1)}/${d.getFullYear()}`; }
function downloadBlob(blob,name){ const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),5000); }
async function shareOrDownload(blob,name,text){ try{ const f=new File([blob],name,{type:blob.type}); if(navigator.canShare&&navigator.canShare({files:[f]})){ await navigator.share({files:[f],title:'Poncty',text}); return; } }catch(e){} downloadBlob(blob,name); }

async function callReport(callId){
  const {data:call}=await sb.from('calls').select('*').eq('id',callId).maybeSingle();
  const {data:roster}=await sb.from('roster').select('id,nom,prenom,matricule').eq('class_id',ctx.cls.id).order('nom');
  const {data:checkins}=await sb.from('checkins').select('roster_id').eq('call_id',callId);
  const {data:members}=await sb.from('members').select('user_id,roster_id').eq('class_id',ctx.cls.id);
  const present=new Set((checkins||[]).map(c=>c.roster_id)); const list=roster||[];
  const presents=list.filter(r=>present.has(r.id)); const absents=list.filter(r=>!present.has(r.id));
  let starterName=''; const sm=(members||[]).find(m=>m.user_id===call.started_by);
  if(sm){ const sr=list.find(r=>r.id===sm.roster_id); if(sr) starterName=(sr.nom.toUpperCase()+' '+(sr.prenom||'')).trim(); }
  return {call,presents,absents,total:list.length,starterName,dateFR:fmtDateFR(call.opened_at)};
}

function makeCallPDF(rep){
  if(!window.jspdf){ toast('Bibliothèque PDF non chargée (connexion requise)'); return null; }
  const {jsPDF}=window.jspdf, doc=new jsPDF({unit:'pt',format:'a4'});
  const W=doc.internal.pageSize.getWidth(), H=doc.internal.pageSize.getHeight(), M=42;
  const hdr=(ctx.cls.header_text||'').trim();
  const black=[20,20,20], grey=[95,95,95], line=[70,70,70];
  function page(title,people){
    let y=48;
    if(hdr){ doc.setFont('helvetica','bold'); doc.setFontSize(11); doc.setTextColor(20,20,20);
      hdr.split('\n').forEach(ln=>{ if(ln.trim()){ doc.text(ln.trim(),W/2,y,{align:'center'}); y+=15; } });
      doc.setDrawColor(70,70,70); doc.line(M,y-3,W-M,y-3); y+=16; } else { y=60; }
    doc.setFont('helvetica','bold'); doc.setFontSize(15); doc.setTextColor(20,20,20);
    const t=title+' — '+rep.dateFR; doc.text(t,W/2,y,{align:'center'});
    const tw=doc.getTextWidth(t); doc.setDrawColor(20,20,20); doc.line(W/2-tw/2,y+3,W/2+tw/2,y+3); y+=19;
    doc.setFont('helvetica','normal'); doc.setFontSize(9.5); doc.setTextColor(95,95,95);
    doc.text((ctx.cls.name||'')+'  ·  Appel effectué par : '+rep.starterName,W/2,y,{align:'center'}); y+=18;
    const x0=M,x3=W-M,tw2=x3-x0,wN=tw2*0.09,wNom=tw2*0.455,x1=x0+wN,x2=x1+wNom,rowH=21;
    const hl=yy=>{doc.setDrawColor(70,70,70);doc.line(x0,yy,x3,yy);};
    const vl=(top,bot)=>{doc.setDrawColor(70,70,70);[x0,x1,x2,x3].forEach(x=>doc.line(x,top,x,bot));};
    const head=()=>{doc.setFont('helvetica','bold');doc.setFontSize(9.5);doc.setTextColor(20,20,20);
      doc.text('N°',x0+wN/2,y+14,{align:'center'});doc.text('NOM',x1+7,y+14);doc.text('PRÉNOMS',x2+7,y+14);y+=rowH;};
    let top=y; hl(top); head(); doc.setFontSize(10);
    if(!people.length){ doc.setFont('helvetica','italic');doc.setTextColor(95,95,95);doc.text('Aucun.',x1+7,y+14); hl(y+rowH); vl(top,y+rowH); }
    else { people.forEach((s,i)=>{ if(y+rowH>H-46){ vl(top,y); doc.addPage(); y=48; top=y; hl(top); head(); }
      doc.setFont('helvetica','normal');doc.setTextColor(95,95,95);doc.text(String(i+1),x0+wN/2,y+14,{align:'center'});
      doc.setFont('helvetica','bold');doc.setTextColor(20,20,20);doc.text((s.nom||'').toUpperCase(),x1+7,y+14);
      doc.setFont('helvetica','normal');doc.text(s.prenom||'',x2+7,y+14); hl(y); y+=rowH; });
      hl(y); vl(top,y); }
    doc.setFont('helvetica','normal');doc.setFontSize(8.5);doc.setTextColor(95,95,95);
    doc.text('Total : '+people.length+'  ·  Généré avec Poncty',W/2,H-24,{align:'center'});
  }
  page('LISTE DES PRÉSENTS', rep.presents);
  doc.addPage();
  page('LISTE DES ABSENTS', rep.absents);
  return doc.output('blob');
}

function renderPiePNG(pres,abs){
  try{ const s=2,Wd=520,Hd=320,cv=document.createElement('canvas');cv.width=Wd*s;cv.height=Hd*s;const g=cv.getContext('2d');g.scale(s,s);
    g.fillStyle='#fff';g.fillRect(0,0,Wd,Hd);const tot=pres+abs||1,cx=150,cy=170,rO=110,rI=62;let a=-Math.PI/2;
    [{v:pres,c:'#188a4d'},{v:abs,c:'#d02b2b'}].forEach(o=>{const ang=o.v/tot*2*Math.PI;g.beginPath();g.moveTo(cx,cy);g.arc(cx,cy,rO,a,a+ang);g.closePath();g.fillStyle=o.c;g.fill();a+=ang;});
    g.beginPath();g.arc(cx,cy,rI,0,2*Math.PI);g.fillStyle='#fff';g.fill();
    g.fillStyle='#17385f';g.textAlign='center';g.font='bold 30px Arial';g.fillText(Math.round(pres/tot*100)+'%',cx,cy-2);g.font='13px Arial';g.fillStyle='#6b7d92';g.fillText('présence',cx,cy+16);
    g.textAlign='left';g.font='15px Arial';g.fillStyle='#188a4d';g.fillRect(300,120,15,15);g.fillStyle='#17385f';g.fillText('Présents : '+pres,324,133);
    g.fillStyle='#d02b2b';g.fillRect(300,152,15,15);g.fillStyle='#17385f';g.fillText('Absents : '+abs,324,165);
    return cv.toDataURL('image/png'); }catch(e){ return null; }
}
async function makeCallXLSX(rep){

  let r=Hh+1; const put=(arr,statut,col)=>{ arr.forEach(p=>{ const a=s1.getCell(r,1),b=s1.getCell(r,2),d=s1.getCell(r,3); a.value=(p.nom||'').toUpperCase();b.value=p.prenom||'';d.value=statut;[a,b,d].forEach(c=>c.border=allB); a.font={bold:true,color:{argb:DARK}};b.font={color:{argb:DARK}};d.font={bold:true,color:{argb:col}};d.alignment={horizontal:'center'}; r++; }); };

  [['Effectif total',tot,DARK],['Présents',nbP,GREEN],['Absents',nbA,RED],['Taux de présence',taux+' %',GREEN]].forEach(([a,b,cc],i)=>{const rr=3+i;const ca=s2.getCell(rr,1),cb=s2.getCell(rr,2);ca.value=a;cb.value=b;ca.border=allB;cb.border=allB;ca.font={bold:true,color:{argb:DARK}};cb.font={bold:true,color:{argb:cc}};cb.alignment={horizontal:'center'};});
  s2.getColumn(1).width=22;s2.getColumn(2).width=14;
  const s3=wb.addWorksheet('Graphique');
  s3.mergeCells('A1:F1');const t3=s3.getCell('A1');t3.value='RÉPARTITION PRÉSENCE / ABSENCE';t3.font={bold:true,size:14,color:{argb:WHITE}};t3.fill=fill(BRAND);t3.alignment={horizontal:'center',vertical:'middle'};s3.getRow(1).height=24;
  const png=renderPiePNG(nbP,nbA); if(png){ const id=wb.addImage({base64:png.substring(png.indexOf(',')+1),extension:'png'}); s3.addImage(id,{tl:{col:0.2,row:2.2},ext:{width:520,height:320}}); }
  const buf=await wb.xlsx.writeBuffer(); return new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});

    if(!name){toast('Nom de la classe requis');return;}
    if(!flow.roster.length){toast('Ajoutez au moins un étudiant');return;}
    const meIdx=parseInt(val('c-me')); if(isNaN(meIdx)||!flow.roster[meIdx]){toast('Sélectionnez votre nom');return;}
    if(!mat){toast('Votre matricule est requis');return;}
    const me=flow.roster[meIdx]; const btn=$('c-go'); btn.disabled=true; btn.textContent='Création…';
    const a=await ensureAuth(email,pass); if(a.error){toast(a.error.message);btn.disabled=false;btn.textContent='Créer la classe';return;}
    const {error}=await sb.rpc('create_class',{p_name:name,p_annee:annee,p_end_date:end||null,p_calls_per_day:cpd,p_roster:flow.roster,p_my_nom:me.nom,p_my_prenom:me.prenom,p_my_matricule:mat});
    if(error){toast('Erreur : '+error.message);btn.disabled=false;btn.textContent='Créer la classe';return;}
    toast('Classe créée !'); await loadContext();
  };
}

/* ===== REJOINDRE ===== */
function renderJoin(){ stopPoll(); flow={};
  $('app').innerHTML=topbar()+`<div class="screen">
    <p class="hint"><button class="link" id="back">← Retour</button></p>
    <h1 class="h1">Rejoindre ma classe</h1>
    <p class="sub">${user?'Entrez le code de votre classe.':'Entrez vos identifiants. Si vous avez déjà une classe, vous y accédez directement.'}</p>
    <div id="j-acc"></div><div id="j-next"></div></div>`;
  $('back').onclick=()=>user?renderJoinOrCreate():renderLanding();
  if(user){ renderJoinCode(); return; }
  $('j-acc').innerHTML=`<div class="card pad">
      <label class="f"><span class="l">Adresse e-mail</span><input class="in" id="j-email" type="email" autocomplete="email" placeholder="exemple@email.com"></label>
      <label class="f" style="margin-bottom:0"><span class="l">Mot de passe</span><input class="in" id="j-pass" type="password" autocomplete="current-password" placeholder="6 caractères min."></label></div>
    <div style="height:14px"></div><button class="btn" id="j-auth">Continuer</button>`;
  $('j-auth').onclick=async()=>{ const email=cap(val('j-email')),pass=val('j-pass');
    if(!email||pass.length<6){ toast('E-mail et mot de passe (6+) requis'); return; }
    const btn=$('j-auth'); btn.disabled=true; btn.textContent='Connexion…';
    const a=await ensureAuth(email,pass); if(a.error){ toast(a.error.message); btn.disabled=false; btn.textContent='Continuer'; return; }
    const {data:mem}=await sb.from('members').select('class_id').eq('user_id',user.id);
    if(mem&&mem.length){ toast('Connexion réussie'); await loadContext(); return; }
    btn.disabled=false; btn.textContent='Continuer'; $('j-acc').innerHTML='<div class="note">Compte connecté. Entrez maintenant le code de votre classe.</div>'; renderJoinCode();
  };
}
function renderJoinCode(){ flow.code=''; flow.info=null; flow.selId=null;
  $('j-next').innerHTML=`<div class="sec">Code de la classe</div>
    <div class="card pad"><label class="f" style="margin-bottom:0"><span class="l">Code communiqué par votre délégué</span><input class="in" id="j-code" placeholder="Ex : USP-A1B2C" autocapitalize="characters"></label></div>
    <div style="height:12px"></div><button class="btn" id="j-check">Voir la liste des noms</button>
    <div id="j-list"></div>`;
  $('j-check').onclick=async()=>{ const code=cap(val('j-code')); if(!code){ toast('Entrez le code'); return; }
    const {data,error}=await sb.rpc('class_roster_available',{p_code:code});
    if(error){ toast('Erreur : '+error.message); return; }
    if(!data||!data.found){ toast('Aucune classe pour ce code'); return; }
    if(data.status!=='active'){ toast('Cette classe est archivée'); return; }
    flow.code=code; flow.info=data; flow.selId=null; renderJoinPick();
  };
}
function renderJoinPick(){
  const names=flow.info.names||[],sdTaken=flow.info.sousdelegue_taken;
  const namesHtml=names.length?names.map(n=>`<div class="pick" data-id="${n.id}"><div class="ck"></div><div class="nm">${esc((n.nom||'').toUpperCase())} <small>${esc(n.prenom)}</small></div></div>`).join(''):'<div class="empty">Tous les noms ont déjà été pris.</div>';
  $('j-list').innerHTML=`<div class="note" style="margin-top:16px">Classe : <b>${esc(flow.info.name)}</b>${flow.info.annee?' · '+esc(flow.info.annee):''}</div>
    <div class="sec">Cochez votre nom</div><div class="card" id="j-names">${namesHtml}</div>
    <div class="sec">Votre matricule</div><div class="card pad"><label class="f" style="margin-bottom:0"><span class="l">Identifiant permanent</span><input class="in" id="j-mat" placeholder="Ex : 20USP0148"></label></div>
    <div class="sec">Votre rôle</div>
    <div class="choice" id="j-role"><button data-role="etudiant" aria-pressed="true">Étudiant</button>
      <button data-role="sousdelegue" aria-pressed="false" ${sdTaken?'disabled':''}>Sous-délégué${sdTaken?'<small>déjà pris</small>':'<small>disponible</small>'}</button></div>
    <div style="height:16px"></div><button class="btn" id="j-go">Rejoindre la classe</button>`;
  $('j-names').querySelectorAll('.pick').forEach(p=>p.onclick=()=>{flow.selId=p.dataset.id;$('j-names').querySelectorAll('.pick').forEach(x=>{x.classList.toggle('sel',x===p);x.querySelector('.ck').textContent=(x===p)?'✓':'';});});
  let roleWanted='etudiant';
  $('j-role').querySelectorAll('button').forEach(b=>b.onclick=()=>{if(b.disabled)return;roleWanted=b.dataset.role;$('j-role').querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b));});
  $('j-go').onclick=async()=>{ const mat=cap(val('j-mat'));
    if(!flow.selId){ toast('Cochez votre nom'); return; }
    if(!mat){ toast('Matricule requis'); return; }
    const btn=$('j-go'); btn.disabled=true; btn.textContent='Inscription…';
    const {data:res,error}=await sb.rpc('join_class',{p_code:flow.code,p_roster_id:flow.selId,p_matricule:mat,p_role_wanted:roleWanted});
    if(error){ if(/inscrit/i.test(error.message)){ toast('Vous êtes déjà dans cette classe'); await loadContext(); return; } toast('Erreur : '+error.message); btn.disabled=false; btn.textContent='Rejoindre la classe'; return; }
    toast('Bienvenue ('+roleLabel(res.role)+')'); await loadContext(); };
}

/* ===== ACCUEIL selon rôle ===== */
async function renderHome(){
  if(ctx.role==='etudiant'){ view='perso'; await renderStudentHome(); return; }
  if(view==='perso'){ await renderStudentHome(); mountRespTabs('perso'); return; }
  await renderRespHome(); mountRespTabs('resp');
}
function mountRespTabs(active){
  const app=$('app');
  const sp=document.createElement('div'); sp.style.height='66px'; app.appendChild(sp);
  const bar=document.createElement('div'); bar.className='rtabs';
  bar.innerHTML=`<button data-v="resp" class="${active==='resp'?'on':''}">${IC.grid}<span>Responsable</span></button><button data-v="perso" class="${active==='perso'?'on':''}">${IC.user}<span>Mon espace</span></button>`;
  app.appendChild(bar);
  bar.querySelectorAll('button').forEach(b=>b.onclick=()=>{ view=b.dataset.v; renderHome(); });
}

/* ---- Responsable ---- */
async function renderRespHome(){
  stopPoll();
  await refreshClass();
  const call=await openCall();
  if(call) return renderRespCall(call);
  const {data:members}=await sb.from('members').select('role,roster_id').eq('class_id',ctx.cls.id);
  const {data:roster}=await sb.from('roster').select('id,matricule,nom,prenom,claimed_by').eq('class_id',ctx.cls.id).order('nom');
  const claimed=(roster||[]).filter(r=>r.claimed_by).length;
  const rmap={};(members||[]).forEach(m=>{if(m.roster_id)rmap[m.roster_id]=m.role;});
  const rows=(roster||[]).map((r,i)=>{const role=rmap[r.id];
    const b=role==='delegue'?'<span class="tag d">DÉLÉGUÉ</span>':role==='sousdelegue'?'<span class="tag d">SOUS-DÉL.</span>':(r.claimed_by?'<span class="tag">inscrit</span>':'<span class="tag free">en attente</span>');
    return `<div class="row"><div class="idx">${i+1}</div><div class="nm">${esc(r.nom)} <small>${esc(r.prenom)}${r.matricule?' · '+esc(r.matricule):''}</small></div>${b}</div>`;}).join('');
  const isDel=ctx.role==='delegue';
  $('app').innerHTML=topbar(true)+`<div class="screen">
    <h1 class="h1">Espace responsable</h1><p class="sub">Aucun appel en cours.</p>
    <button class="btn big green" id="start">📍 Démarrer l'appel</button>
    <p class="hint">Votre position deviendra le centre. Les étudiants auront 30 minutes pour pointer dans un rayon de <b>${ctx.cls.radius_m} m</b>.</p>
    <div class="sec">Réglages</div>
    <div class="card">
      <div class="row"><div class="nm">Périmètre (m)</div>${isDel?`<input class="in" id="rad" type="number" value="${ctx.cls.radius_m}" style="width:110px;padding:8px 10px"> <button class="btn small" id="rad-save">OK</button>`:`<div>${ctx.cls.radius_m} m</div>`}</div>
      <div class="row"><div class="nm">Appels par jour</div><div>${ctx.cls.calls_per_day}</div></div>
      <div class="row"><div class="nm">Fin d'année</div><div>${esc(ctx.cls.end_date)||'—'}</div></div>
      <div class="row"><div class="nm">En-tête du document</div>${isDel?'<button class="btn small ghost" id="hdr-edit">Modifier</button>':'<div>—</div>'}</div>
    </div>
    <div class="sec">Code d'accès</div><div class="code">${esc(ctx.cls.code)}</div>
    <div class="sec">Liste · ${claimed}/${(roster||[]).length} inscrits</div>
    <div class="card">${rows||'<div class="empty">Liste vide.</div>'}</div>
    <div class="sec">Tableau de bord</div><div class="card" id="dash"><div class="empty">Chargement…</div></div>
    <div class="sec">Historique des appels</div><div class="card" id="hist"><div class="empty">Chargement…</div></div>
    ${isDel?`<div style="height:16px"></div><button class="btn danger" id="del">Supprimer la classe</button>`:''}
    <p class="hint" style="margin-top:18px;text-align:center"><button class="link" id="lo">Se déconnecter</button></p></div>`;
  $('lo').onclick=logout;
  if($('rad-save'))$('rad-save').onclick=async()=>{const v=parseInt(val('rad'));if(!v||v<10){toast('Périmètre invalide');return;}
    const {error}=await sb.from('classes').update({radius_m:v}).eq('id',ctx.cls.id); if(error){toast('Erreur : '+error.message);return;} ctx.cls.radius_m=v; toast('Périmètre mis à jour');};
  if($('del'))$('del').onclick=async()=>{if(!confirm('Supprimer définitivement cette classe ?'))return;const {error}=await sb.rpc('delete_class',{p_class:ctx.cls.id});if(error){toast('Erreur : '+error.message);return;}ctx=null;toast('Classe supprimée');await loadContext();};
  if($('hdr-edit'))$('hdr-edit').onclick=openHeaderForm; loadRespExtras();
  $('start').onclick=()=>{ locationConsent(async(coords)=>{ const {error}=await sb.rpc('start_call',{p_class:ctx.cls.id,p_lat:coords.latitude,p_lng:coords.longitude}); if(error) return {error:error.message}; return {ok:true}; }, 'Votre position définira le centre de l\'appel. Elle est utilisée une seule fois.'); };
}
async function renderRespCall(call){
  const isStarter=call.started_by===user.id;
  const {data:roster}=await sb.from('roster').select('id,nom,prenom').eq('class_id',ctx.cls.id).order('nom');
  const {data:checkins}=await sb.from('checkins').select('roster_id,method,vpn_flag').eq('call_id',call.id);
  const present={},vpn={}; (checkins||[]).forEach(c=>{present[c.roster_id]=c.method; if(c.vpn_flag)vpn[c.roster_id]=true;});
  const list=(roster||[]);
  const nbP=list.filter(r=>present[r.id]).length, nbA=list.length-nbP;
  const myPresent=ctx.rosterId?!!present[ctx.rosterId]:false;
  let selfHtml='';
  if(!isStarter){
    selfHtml = myPresent
      ? `<div class="big-status ok" style="margin:0 0 12px">✓ Vous êtes marqué présent</div>`
      : `<div class="note" style="margin:0 0 10px">Vous n'avez pas lancé cet appel : pointez votre présence comme un étudiant.</div><button class="btn big green" id="self-point" style="margin-bottom:12px">📍 Pointer ma présence</button>`;
  }
  const rows=list.map((r,i)=>{ const p=present[r.id];
    const right=p?((p==='manual'?'<span class="st-p">Présent (manuel)</span>':p==='starter'?'<span class="st-p">Présent (appel)</span>':'<span class="st-p">Présent</span>')+(vpn[r.id]?' <span class="tag" style="background:#fdeaea;color:#d02b2b">VPN</span>':''))
      :(isStarter?`<button class="btn small ghost" data-mp="${r.id}">Présent manuel</button>`:'<span class="st-a">Absent</span>');
    return `<div class="row"><div class="idx">${i+1}</div><div class="nm">${esc(r.nom)} <small>${esc(r.prenom)}</small></div>${right}</div>`;}).join('');
  $('app').innerHTML=topbar(true)+`<div class="screen">
    <div class="banner"><div class="t">Appel en cours · fin dans</div><div class="big" id="rem">${fmt(remainFrom(call))}</div></div>
    ${selfHtml}
    <div class="counters"><div class="counter p"><div class="n">${nbP}</div><div class="l">Présents</div></div>
      <div class="counter a"><div class="n">${nbA}</div><div class="l">Absents</div></div>
      <div class="counter"><div class="n">${list.length}</div><div class="l">Total</div></div></div>
    <div style="display:flex;gap:8px;margin-bottom:8px">
      <button class="btn ghost small" id="refr" style="flex:1">Rafraîchir</button>
      <button class="btn danger small" id="close" style="flex:1">Clôturer l'appel</button></div>
    <div class="card">${rows}</div>
    <p class="hint">${isStarter?'« Présent manuel » vous est réservé (vous avez lancé l\'appel).':'Seul le responsable qui a lancé l\'appel peut cocher « présent manuel ».'}</p>
    <p class="hint" style="text-align:center;margin-top:14px"><button class="link" id="lo">Se déconnecter</button></p></div>`;
  $('lo').onclick=logout;
  $('refr').onclick=()=>renderHome();
  $('close').onclick=async()=>{ if(!confirm('Clôturer l\'appel maintenant ?'))return; const {error}=await sb.rpc('close_call',{p_call:call.id}); if(error){toast('Erreur : '+error.message);return;} toast('Appel clôturé'); const cid=call.id; await renderHome(); exportCallMenu(cid); };
  if($('self-point'))$('self-point').onclick=()=>{
    locationConsent(async(coords)=>{ const {error}=await sb.rpc('checkin',{p_call:call.id,p_lat:coords.latitude,p_lng:coords.longitude,p_vpn:await detectVPN()}); if(error) return {error:error.message}; return {ok:true}; }); };
  document.querySelectorAll('[data-mp]').forEach(b=>b.onclick=async()=>{ const {error}=await sb.rpc('manual_present',{p_call:call.id,p_roster_id:b.dataset.mp}); if(error){toast('Erreur : '+error.message);return;} renderHome(); });
  stopPoll(); poll=setInterval(async()=>{ const c=await openCall(); if(!c){ stopPoll(); renderHome(); return; } const r=$('rem'); if(r) r.textContent=fmt(remainFrom(c)); }, 4000);
}
async function currentCall(id){ const {data}=await sb.from('calls').select('*').eq('id',id).maybeSingle(); return data; }

/* ---- Étudiant ---- */
async function renderStudentHome(){
  stopPoll();
  const prenom=ctx.myName?ctx.myName.split(' ').slice(1).join(' '):'';
  const call=await openCall();
  let mine=null;
  if(call){ const {data}=await sb.from('checkins').select('id,method,distance_m').eq('call_id',call.id).eq('roster_id',ctx.rosterId).maybeSingle(); mine=data; }
  let body;
  if(!call){
    body=`<div class="big-status no">Aucun appel en cours</div><p class="hint" style="text-align:center">Quand votre responsable démarrera l'appel, un bouton « Pointer » apparaîtra ici. Gardez cette page ouverte.</p><div style="height:12px"></div><button class="btn ghost" id="refr">Rafraîchir</button>`;
  } else if(mine){
    body=`<div class="big-status ok">✓ Vous êtes marqué présent</div><p class="hint" style="text-align:center">Pointage enregistré${mine.distance_m!=null?' à '+Math.round(mine.distance_m)+' m du responsable':''}.</p>`;
  } else {
    body=`<div class="banner"><div class="t">Appel ouvert · il reste</div><div class="big" id="rem">${fmt(remainFrom(call))}</div></div>
      <div class="note" style="margin:12px 0">En appuyant sur « Pointer », vous partagez votre position une seule fois (rayon ${call.radius_m} m). Votre navigateur demandera l'autorisation.</div>
      <button class="btn big green" id="point">📍 Pointer ma présence</button>
      <p class="hint">Position refusée alors que vous êtes présent ? Demandez au responsable de vous cocher « présent manuel ».</p>`;
  }
  $('app').innerHTML=topbar(true)+`<div class="screen"><h1 class="h1">Bonjour${prenom?', '+esc(prenom):''}</h1><p class="sub">${esc(ctx.myName)||''}</p>${body}<div id="mystats"></div><p class="hint" style="margin-top:20px;text-align:center"><button class="link" id="lo">Se déconnecter</button></p></div>`;
  $('lo').onclick=logout;
  if($('refr'))$('refr').onclick=()=>renderHome();
  if($('point'))$('point').onclick=()=>{ locationConsent(async(coords)=>{ const {error}=await sb.rpc('checkin',{p_call:call.id,p_lat:coords.latitude,p_lng:coords.longitude,p_vpn:await detectVPN()}); if(error) return {error:error.message}; return {ok:true}; }); };
  loadMyStats();
  stopPoll(); poll=setInterval(async()=>{ const c=await openCall(); if((!!c)!==(!!call)){ renderHome(); return; } if(c&&!mine){ const r=$('rem'); if(r) r.textContent=fmt(remainFrom(c)); } }, 5000);
}
async function logout(){ stopPoll(); await sb.auth.signOut(); user=null; ctx=null; renderLanding(); }
boot();
</script>
